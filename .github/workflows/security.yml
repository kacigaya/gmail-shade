name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run audit:deps
