name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Ship nothing that fails the same checks used locally.
      - run: bun test
      - run: bun run compile
      - run: bun run test:browser

      - run: bun run zip
      - run: bun run zip:firefox
      - run: bun run lint:firefox
      - run: bun run test:firefox
      - run: bun run audit:deps

      # Upload to a draft, verify both exact ZIPs, then publish.
      - run: bun scripts/publish-release.ts
        env:
          GH_TOKEN: ${{ github.token }}
